services:
  ovos:
    build:
      context: ./ovos-stack
      dockerfile: Dockerfile
      args:
        INSTALL_LLM_FALLBACK: ${INSTALL_LLM_FALLBACK:-false}
    container_name: ${CONTAINER_PREFIX:-enms}-ovos
    restart: unless-stopped
    ports:
      - "${OVOS_BRIDGE_EXTERNAL_PORT:-5000}:5000"
      - "${OVOS_MESSAGEBUS_PORT:-8181}:8181"
    environment:
      ENMS_API_URL: ${ENMS_API_URL:-http://enms-analytics:8001/api/v1}
      OVOS_BRIDGE_PORT: 5000
      STRUCTURED_RESPONSE_GRACE_SECONDS: ${STRUCTURED_RESPONSE_GRACE_SECONDS:-2.5}
      OVOS_TTS_ENABLED: ${OVOS_TTS_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OVOS_CONFIG_PATH: /config/mycroft/mycroft.conf
      XDG_CONFIG_HOME: /config
    volumes:
      - ./ovos-stack/enms-ovos-skill:/opt/ovos/skills/enms-ovos-skill:rw
      - ovos-logs:/var/log/ovos
      - supervisor-logs:/var/log/supervisor
    depends_on:
      analytics:
        condition: service_healthy
    networks:
      - enms-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health >/dev/null && python -c \"import socket; sock = socket.create_connection(('127.0.0.1', 8181), 2); sock.close()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ovos-logs:
    name: ${VOLUME_PREFIX:-enms}-ovos-logs
  supervisor-logs:
    name: ${VOLUME_PREFIX:-enms}-ovos-supervisor-logs
